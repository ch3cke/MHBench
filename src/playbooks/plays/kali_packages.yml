---
- hosts: "{{ host }}"
  remote_user: root

  tasks:

    - name: Switch http -> https in sources.list
      replace:
        path: /etc/apt/sources.list
        regexp: 'http://'
        replace: 'https://'

    - name: Install Kali Linux archive keyring
      ansible.builtin.copy:
        src: aux_files/kali-archive-keyring.gpg
        dest: /usr/share/keyrings/kali-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"
    
    - name: Add Kali Linux repository
      become: true
      copy:
        dest: /etc/apt/sources.list.d/kali.list
        content: |
          deb https://kali.download/kali kali-rolling main contrib non-free

    - name: Update APT cache
      become: true
      apt:
        update_cache: yes

    - name: Install base dependencies
      become: true
      apt:
        pkg:
          - kali-tools-top10
          - gobuster
          - wordlists
          - net-tools
          - curl
          - wget
          - sshpass
          - nmap
          - ncat
          - python3
          - python3-pip
          - nikto
          - unzip
          - ethtool
        state: present

    # - name: Disable virtio VLAN hardware filtering to prevent boot hang
